name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Called by the release workflows so the release gate *is* the everyday gate
  # rather than a copy of it that drifts. Nothing here reads a secret, so the
  # call site grants none.
  workflow_call:

# Least privilege: nothing in CI writes to the repository, and fork pull
# requests never see credentials (none are configured for this workflow).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  engine:
    name: engine (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
          - name: windows
            os: windows-latest
          - name: macos
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      # Third-party actions are pinned by immutable commit SHA.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy

      - name: Install nextest
        uses: taiki-e/install-action@b20dedce73af6905cdc30d6611090c9b67557c8d # v2
        with:
          tool: cargo-nextest

      - name: Check formatting
        if: runner.os == 'Linux'
        working-directory: crates/antiburn-local
        run: cargo fmt --check

      - name: Clippy
        working-directory: crates/antiburn-local
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Tests (including source-boundary suite)
        working-directory: crates/antiburn-local
        run: cargo nextest run --locked --lib --tests

  desktop-frontend:
    name: desktop app (frontend, ${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
          # Windows too: the frontend suite covers path handling, line endings,
          # and the platform-aware modifier logic, and those are exactly the
          # places a Linux-only run cannot fail. macOS is left out on purpose —
          # it is the slowest runner and shares its behaviour here with Linux,
          # while the shell (which does not) is covered on all three below.
          - name: windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    env:
      # Corepack must never block CI on its interactive download prompt.
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      # pnpm comes from the repository's `packageManager` pin via Corepack,
      # so CI and local checkouts always agree on the version.
      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter @antiburn/desktop lint

      - name: Type-check
        run: pnpm --filter @antiburn/desktop type-check

      - name: Test
        run: pnpm --filter @antiburn/desktop test

      - name: Build
        run: pnpm --filter @antiburn/desktop build

  desktop-backend:
    name: desktop app (backend, ${{ matrix.name }})
    # The shell owns every piece of platform-specific code in the application —
    # tray item, popover anchoring, window policy, path handling — so it is
    # built and tested on the whole release matrix rather than on Linux alone.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
          - name: windows
            os: windows-latest
          - name: macos
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Tauri's Linux backend builds against the system WebKitGTK, GTK, and
      # tray (AppIndicator) development packages. Windows and macOS use the
      # webview and tray the operating system already ships.
      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            build-essential \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy

      # Debug builds resolve the frontend from the dev server, so the shell's
      # checks need no Node toolchain. Release packaging (which embeds the
      # built bundle) happens in the release workflow.
      - name: Check formatting
        if: runner.os == 'Linux'
        working-directory: apps/desktop/src-tauri
        run: cargo fmt --check

      - name: Clippy
        working-directory: apps/desktop/src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Tests
        working-directory: apps/desktop/src-tauri
        run: cargo test --locked

  boundary:
    name: whole-tree source boundary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Scan the tree for prohibited concepts
        run: node scripts/check-boundary.mjs

  licenses:
    name: dependency licenses
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install cargo-deny
        uses: taiki-e/install-action@b20dedce73af6905cdc30d6611090c9b67557c8d # v2
        with:
          tool: cargo-deny

      # `check licenses` does not evaluate `[bans]`. The engine's deny.toml
      # bans the HTTP clients, TLS stacks, and the app framework outright, so
      # the ban list has to be run or it is inert configuration describing a
      # boundary nothing enforces.
      - name: Check engine licenses and dependency bans
        working-directory: crates/antiburn-local
        run: cargo deny --locked check bans licenses

      # The app crate has no `[bans]` block by design — it legitimately links
      # Tauri and the updater plugin — so only its licenses are checked.
      - name: Check desktop app licenses
        working-directory: apps/desktop/src-tauri
        run: cargo deny --locked check licenses

  dco:
    name: DCO sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Verify every commit is signed off
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          missing=0
          while IFS= read -r sha; do
            if ! git log -1 --format=%B "$sha" | grep -qi '^Signed-off-by: .\+<.\+@.\+>'; then
              echo "::error::commit $sha is missing a Signed-off-by trailer (git commit -s)"
              missing=1
            fi
          done < <(git rev-list "$BASE_SHA".."$HEAD_SHA")
          exit "$missing"
