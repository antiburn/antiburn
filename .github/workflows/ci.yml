name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: nothing in CI writes to the repository, and fork pull
# requests never see credentials (none are configured for this workflow).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  engine:
    name: engine (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
          - name: windows
            os: windows-latest
          - name: macos
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      # Third-party actions are pinned by immutable commit SHA.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy

      - name: Install nextest
        uses: taiki-e/install-action@b20dedce73af6905cdc30d6611090c9b67557c8d # v2
        with:
          tool: cargo-nextest

      - name: Check formatting
        if: runner.os == 'Linux'
        working-directory: crates/antiburn-local
        run: cargo fmt --check

      - name: Clippy
        working-directory: crates/antiburn-local
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Tests (including source-boundary suite)
        working-directory: crates/antiburn-local
        run: cargo nextest run --locked --lib --tests

  licenses:
    name: dependency licenses
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install cargo-deny
        uses: taiki-e/install-action@b20dedce73af6905cdc30d6611090c9b67557c8d # v2
        with:
          tool: cargo-deny

      - name: Check licenses
        working-directory: crates/antiburn-local
        run: cargo deny --locked check licenses

  dco:
    name: DCO sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Verify every commit is signed off
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          missing=0
          while IFS= read -r sha; do
            if ! git log -1 --format=%B "$sha" | grep -qi '^Signed-off-by: .\+<.\+@.\+>'; then
              echo "::error::commit $sha is missing a Signed-off-by trailer (git commit -s)"
              missing=1
            fi
          done < <(git rev-list "$BASE_SHA".."$HEAD_SHA")
          exit "$missing"
