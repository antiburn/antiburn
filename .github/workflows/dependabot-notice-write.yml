name: Dependabot notice write

on:
  workflow_run:
    workflows: [Dependabot notice generation]
    types: [completed]

permissions:
  contents: read

jobs:
  prepare:
    if: >-
      github.repository == 'antiburn/antiburn' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_branch, 'dependabot/')
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      artifact_id: ${{ steps.source.outputs.artifact_id }}
      head_ref: ${{ steps.source.outputs.head_ref }}
      head_sha: ${{ steps.source.outputs.head_sha }}
      pr_number: ${{ steps.source.outputs.pr_number }}
    steps:
      - name: Check out trusted validation code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          submodules: false
          lfs: false

      - name: Find the exact Dependabot pull request and notice artifact
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_OWNER: ${{ github.repository_owner }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          git check-ref-format --branch "$HEAD_BRANCH"
          pull_requests="$(gh api "repos/${GITHUB_REPOSITORY}/pulls" -f state=open -f head="${HEAD_OWNER}:${HEAD_BRANCH}" -f base=main -f per_page=100)"
          source="$(printf '%s' "$pull_requests" | node scripts/verify-dependabot-notice-run.mjs)"
          if [[ "$(printf '%s' "$source" | jq -r '.eligible // true')" == "false" ]]; then
            echo "No open Dependabot pull request remains for this workflow run."
            {
              echo "artifact_id="
              echo "head_ref="
              echo "head_sha="
              echo "pr_number="
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pr_number="$(printf '%s' "$source" | jq -r '.number')"
          head_ref="$(printf '%s' "$source" | jq -r '.head_ref')"
          head_sha="$(printf '%s' "$source" | jq -r '.head_sha')"

          artifacts="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts?per_page=100")"
          artifact_name="dependabot-notices-${head_sha}"
          artifact_count="$(printf '%s' "$artifacts" | jq --arg name "$artifact_name" '[.artifacts[] | select(.name == $name and .expired == false)] | length')"
          if [[ "$artifact_count" -gt 1 ]]; then
            echo "::error::Found more than one notice artifact for this workflow run."
            exit 1
          fi
          artifact_id=""
          if [[ "$artifact_count" -eq 1 ]]; then
            artifact_id="$(printf '%s' "$artifacts" | jq -r --arg name "$artifact_name" '.artifacts[] | select(.name == $name and .expired == false) | .id')"
          fi

          {
            echo "artifact_id=$artifact_id"
            echo "head_ref=$head_ref"
            echo "head_sha=$head_sha"
            echo "pr_number=$pr_number"
          } >> "$GITHUB_OUTPUT"

  write:
    needs: prepare
    if: needs.prepare.outputs.artifact_id != ''
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      - name: Check out the verified Dependabot commit without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ needs.prepare.outputs.head_sha }}
          path: dependabot-pr
          persist-credentials: false
          submodules: false
          lfs: false

      - name: Download the notice artifact from the generation run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact_id }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/dependabot-notices

      - name: Validate the current pull request and prepare a signed commit
        id: commit
        working-directory: dependabot-pr
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ needs.prepare.outputs.head_ref }}
          HEAD_SHA: ${{ needs.prepare.outputs.head_sha }}
          PR_NUMBER: ${{ needs.prepare.outputs.pr_number }}
          ARTIFACT_DIR: ${{ runner.temp }}/dependabot-notices
          COMMIT_AUTHOR_NAME: ${{ vars.DEPENDABOT_NOTICES_AUTHOR_NAME }}
          COMMIT_AUTHOR_EMAIL: ${{ vars.DEPENDABOT_NOTICES_AUTHOR_EMAIL }}
        shell: bash
        run: |
          set -euo pipefail
          git check-ref-format --branch "$HEAD_REF"
          [[ "$(git rev-parse HEAD)" == "$HEAD_SHA" ]]

          pull_request="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          printf '%s' "$pull_request" | jq -e \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg head_ref "$HEAD_REF" \
            --arg head_sha "$HEAD_SHA" \
            '.state == "open" and
             .user.login == "dependabot[bot]" and
             .head.repo.full_name == $repository and
             .head.ref == $head_ref and
             .head.sha == $head_sha and
             .base.repo.full_name == $repository and
             .base.ref == "main"' > /dev/null

          mapfile -t artifact_files < <(find "$ARTIFACT_DIR" -type f -print)
          [[ "${#artifact_files[@]}" -eq 1 ]]
          artifact_file="${artifact_files[0]}"
          [[ "${artifact_file##*/}" == "THIRD_PARTY_NOTICES" ]]
          [[ ! -L "$artifact_file" ]]
          install -m 0644 -- "$artifact_file" THIRD_PARTY_NOTICES

          if git diff --quiet -- THIRD_PARTY_NOTICES; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mapfile -t changed_files < <(git diff --name-only)
          [[ "${#changed_files[@]}" -eq 1 && "${changed_files[0]}" == "THIRD_PARTY_NOTICES" ]]
          git diff --check -- THIRD_PARTY_NOTICES

          if [[ -z "$COMMIT_AUTHOR_NAME" || -z "$COMMIT_AUTHOR_EMAIL" ]]; then
            echo "::error::Set the DEPENDABOT_NOTICES_AUTHOR_NAME and DEPENDABOT_NOTICES_AUTHOR_EMAIL repository variables before enabling notice commits."
            exit 1
          fi
          if [[ ! "$COMMIT_AUTHOR_EMAIL" =~ ^[^[:space:]\<\>]+@[^[:space:]\<\>]+$ ]]; then
            echo "::error::DEPENDABOT_NOTICES_AUTHOR_EMAIL must be a valid email address."
            exit 1
          fi

          git config user.name "$COMMIT_AUTHOR_NAME"
          git config user.email "$COMMIT_AUTHOR_EMAIL"
          git add -- THIRD_PARTY_NOTICES
          mapfile -t staged_files < <(git diff --cached --name-only)
          [[ "${#staged_files[@]}" -eq 1 && "${staged_files[0]}" == "THIRD_PARTY_NOTICES" ]]
          git commit -s -m "chore: update third-party notices"
          [[ "$(git rev-parse HEAD^)" == "$HEAD_SHA" ]]
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Revalidate the pull request before pushing
        if: steps.commit.outputs.changed == 'true'
        working-directory: dependabot-pr
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ needs.prepare.outputs.head_ref }}
          HEAD_SHA: ${{ needs.prepare.outputs.head_sha }}
          PR_NUMBER: ${{ needs.prepare.outputs.pr_number }}
        shell: bash
        run: |
          set -euo pipefail
          pull_request="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          printf '%s' "$pull_request" | jq -e \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg head_ref "$HEAD_REF" \
            --arg head_sha "$HEAD_SHA" \
            '.state == "open" and
             .user.login == "dependabot[bot]" and
             .head.repo.full_name == $repository and
             .head.ref == $head_ref and
             .head.sha == $head_sha and
             .base.repo.full_name == $repository and
             .base.ref == "main"' > /dev/null
          [[ "$(git rev-parse HEAD^)" == "$HEAD_SHA" ]]

      - name: Push the signed notice commit with a branch lease
        if: steps.commit.outputs.changed == 'true'
        working-directory: dependabot-pr
        env:
          GH_TOKEN: ${{ secrets.DEPENDABOT_NOTICES_TOKEN }}
          HEAD_REF: ${{ needs.prepare.outputs.head_ref }}
          HEAD_SHA: ${{ needs.prepare.outputs.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::error::Set the DEPENDABOT_NOTICES_TOKEN repository Actions secret before enabling notice commits."
            exit 1
          fi
          [[ "$(git rev-parse HEAD^)" == "$HEAD_SHA" ]]
          gh auth setup-git
          git push --force-with-lease="refs/heads/${HEAD_REF}:${HEAD_SHA}" origin "HEAD:refs/heads/${HEAD_REF}"
