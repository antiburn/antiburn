name: Update Homebrew tap

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Published stable desktop tag (antiburn-vX.Y.Z)"
        required: true
        type: string
  pull_request:
    paths:
      - .github/workflows/update-homebrew-tap.yml
      - scripts/update-homebrew-cask.mjs
      - scripts/update-homebrew-cask.test.mjs

permissions:
  contents: read

concurrency:
  group: update-homebrew-tap
  cancel-in-progress: false

jobs:
  update:
    if: >-
      github.repository == 'antiburn/antiburn' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
       (github.event_name == 'release' && !github.event.release.prerelease &&
        !github.event.release.draft && startsWith(github.event.release.tag_name, 'antiburn-v')))
    runs-on: macos-15
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_ANALYTICS: "1"
      REQUESTED_TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - name: Checkout updater
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event.repository.default_branch }}
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Validate requested tag
        if: github.event_name != 'pull_request'
        run: |
          node --input-type=module -e '
            import { versionFromTag } from "./scripts/update-homebrew-cask.mjs";
            versionFromTag(process.env.REQUESTED_TAG);
          '

      - name: Checkout tap
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: antiburn/homebrew-tap
          ref: main
          path: tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Select release
        id: release
        run: |
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            REQUESTED_TAG=$(node --input-type=module -e '
              import { readFileSync } from "node:fs";
              import { caskVersion } from "./scripts/update-homebrew-cask.mjs";
              console.log("antiburn-v" + caskVersion(readFileSync("tap/Casks/antiburn.rb", "utf8")));
            ')
          fi
          printf 'tag=%s\n' "$REQUESTED_TAG" >> "$GITHUB_OUTPUT"

      - name: Update and validate cask
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          node --test scripts/update-homebrew-cask.test.mjs
          brew tap --custom-remote antiburn/tap "$GITHUB_WORKSPACE/tap"
          CASK_PATH="$(brew --repository antiburn/tap)/Casks/antiburn.rb"
          node scripts/update-homebrew-cask.mjs "$RELEASE_TAG" "$CASK_PATH"
          brew style --cask antiburn/tap/antiburn
          brew audit --cask --strict --online antiburn/tap/antiburn
          cp "$CASK_PATH" tap/Casks/antiburn.rb

      - name: Verify tap write access without changing it
        working-directory: tap
        run: git push --dry-run origin HEAD:main

      - name: Commit and push version bump
        if: github.event_name != 'pull_request'
        working-directory: tap
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          if git diff --quiet -- Casks/antiburn.rb; then
            printf 'Cask already matches %s\n' "$RELEASE_TAG"
            exit 0
          fi
          git add Casks/antiburn.rb
          git commit -s -m "chore: update antiburn to ${RELEASE_TAG#antiburn-v}"
          git push origin HEAD:main
