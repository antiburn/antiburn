name: Dependabot notice generation

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: dependabot-notices-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  generate:
    if: >-
      github.repository == 'antiburn/antiburn' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'dependabot/')
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.notice.outputs.changed }}
    steps:
      - name: Check out the Dependabot commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          submodules: false
          lfs: false

      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Enable Corepack
        run: corepack enable

      - name: Install frontend dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install Rust license tools
        uses: taiki-e/install-action@b20dedce73af6905cdc30d6611090c9b67557c8d # v2
        with:
          tool: cargo-about@0.9.2

      - name: Generate third-party notices
        id: notice
        shell: bash
        run: |
          set -euo pipefail
          pnpm notices
          if git diff --quiet -- THIRD_PARTY_NOTICES; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/dependabot-notices"
          cp -- THIRD_PARTY_NOTICES "$RUNNER_TEMP/dependabot-notices/THIRD_PARTY_NOTICES"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Upload the generated notice file
        if: steps.notice.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependabot-notices-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/dependabot-notices/THIRD_PARTY_NOTICES
          if-no-files-found: error
          retention-days: 1
