# pnpm workspace root for antiburn's JavaScript/TypeScript packages.
# The Rust engine (crates/antiburn-local) and the desktop app's Rust shell
# (apps/desktop/src-tauri) are standalone Cargo workspaces and are not
# members of this workspace.
packages:
  - apps/*

minimumReleaseAgeExclude:
  - '@secretlint/config-creator@13.0.5'
  - '@secretlint/config-loader@13.0.5'
  - '@secretlint/core@13.0.5'
  - '@secretlint/formatter@13.0.5'
  - '@secretlint/node@13.0.5'
  - '@secretlint/profiler@13.0.5'
  - '@secretlint/resolver@13.0.5'
  - '@secretlint/secretlint-rule-preset-recommend@13.0.5'
  - '@secretlint/source-creator@13.0.5'
  - '@secretlint/types@13.0.5'
  - '@secretlint/walker@13.0.5'
  - secretlint@13.0.5

# The temporary aislop fork builds its CLI from the pinned source revision.
allowBuilds:
  aislop@https://codeload.github.com/daveslutzkin/aislop/tar.gz/caa0959c6a22ee8c6923cbb2360a9f0729e6ebc6: true

# No other dependency can run an install script.
onlyBuiltDependencies: []
