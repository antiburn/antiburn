[workspace]

[package]
name = "antiburn-remote"
version = "0.9.0"
edition = "2024"
description = "Bounded, read-only Linux helper for importing Antiburn sessions over SSH."
license = "MIT"
repository = "https://github.com/antiburn/antiburn"
publish = false

[dependencies]
antiburn-local = { path = "../antiburn-local" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["rt", "macros", "process", "time", "io-util", "sync", "fs"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
time = "0.3"
