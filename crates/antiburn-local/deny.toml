# cargo-deny configuration for the antiburn-local engine.
#
# CI runs `cargo deny --locked check bans licenses` and
# `cargo deny --locked check advisories` against the engine's own lockfile.
# Both halves matter and both are run: every dependency must carry one of the
# allowed permissive licenses (MPL-2.0 is the project's own), and none of the
# telemetry/analytics SDKs in the `[bans]` block below may appear at all —
# the engine needs no service of ours, so it links nothing that phones home
# on the reader's behalf. Running only `check licenses` would leave that ban
# list as configuration describing a boundary nothing enforced. Additions to
# either list need explicit review.

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unlicense",
    "MPL-2.0",
]

[bans]
# The mechanical boundary test (tests/boundary.rs) already forbids
# telemetry/analytics SDKs by name; duplicate the load-bearing ones here so
# `cargo deny` fails fast too.
deny = [
    { crate = "sentry" },
    { crate = "opentelemetry" },
    { crate = "posthog" },
    { crate = "segment" },
    { crate = "datadog" },
]
