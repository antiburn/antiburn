[workspace]

[package]
name = "antiburn-cloud-capture"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/antiburn/antiburn"
description = "Feature-gated, network-free native capture and durable upload queue."
publish = false

[features]
default = []
cloud = ["dep:errno", "dep:flate2", "dep:libc", "dep:serde", "dep:serde_json", "dep:sha2"]

[dependencies]
flate2 = { version = "1", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
sha2 = { version = "0.11", optional = true }

[target.'cfg(unix)'.dependencies]
errno = { version = "0.3", optional = true }
libc = { version = "0.2", optional = true }

[dev-dependencies]
tempfile = "3"

[[test]]
name = "capture"
required-features = ["cloud"]

[[example]]
name = "write_fixture"
required-features = ["cloud"]
