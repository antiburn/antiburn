# Standalone workspace root. The shell is deliberately *not* a member of any
# other workspace: the engine (`crates/antiburn-local`) resolves with its own
# lockfile and its own network-free dependency boundary, and joining the two
# would let the shell's app-framework dependencies leak into that resolution.
[workspace]

[package]
name = "antiburn"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "antiburn desktop application: a tray/menu-bar shell over the local antiburn engine."
license = "MPL-2.0"
repository = "https://github.com/antiburn/antiburn"
publish = false

[lib]
# The Tauri entry point lives in the library so the binary is a thin launcher.
name = "antiburn_desktop"
path = "src/lib.rs"

[[bin]]
name = "antiburn"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# The local engine. This is the only first-party dependency; the shell adds
# windows, tray, and IPC around it and owns no analysis logic of its own.
antiburn-local = { path = "../../../crates/antiburn-local" }
# Error plumbing inside the shell's own modules; never crosses the IPC edge,
# where errors become plain strings.
anyhow = "1"
# The app-owned local database. `bundled` compiles SQLite from source, so the
# app never depends on a system library and CI needs no extra packages.
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
# Required by `tauri::generate_context!`, which expands to code in this crate.
serde_json = "1"
# `tray-icon` gives the menu-bar item; `image-png` lets the tray glyph be
# decoded from the generated PNG.
tauri = { version = "2", features = ["image-png", "tray-icon"] }
tauri-plugin-dialog = "2"
# Local desktop notifications, delivered by the platform's own notification
# centre. Nothing about a notification leaves the machine, and the plugin is
# driven from Rust only — the webview is granted no notification permission,
# so the shell decides what is worth interrupting a reader for.
#
# Licensing: `Apache-2.0 OR MIT`, like the other Tauri plugins here. It brings
# in its three platform backends — `mac-notification-sys`, `notify-rust`,
# `tauri-winrt-notification` — plus `rand` and `ppv-lite86`, every one of them
# `MIT OR Apache-2.0` and already covered by `deny.toml`. It adds no
# network-capable dependency: `cargo tree -e normal -i reqwest` still resolves
# solely through `tauri-plugin-updater`.
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
# RFC 3339 stamps for the store's own timestamps.
time = { version = "0.3", features = ["formatting"] }
# The scan scheduler. Deliberately excludes `net`: the shell opens no sockets
# either — the updater plugin is the only network-capable surface.
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# Desktop-only: GitHub Releases update checks. Registered in release builds
# only (see `src/lib.rs`), so development never contacts the network.
tauri-plugin-updater = "2"

[dev-dependencies]
# Synthetic agent stores for the scan-pipeline tests.
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
