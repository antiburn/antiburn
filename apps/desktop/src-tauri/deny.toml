# cargo-deny configuration for the antiburn desktop app crate.
#
# CI runs `cargo deny --locked check bans licenses` and
# `cargo deny --locked check advisories` against this crate's own lockfile;
# every dependency must carry one of the allowed permissive licenses. The app's
# small first-party client must not be replaced or supplemented by a telemetry,
# analytics, or crash-reporting SDK.

[advisories]
# These dependencies are unavoidable parts of the current Tauri desktop stack.
# Each exception names exact RustSec IDs, so new advisories still fail CI.
# GTK3 is pulled by Tauri's Linux webview/tray stack; migration to GTK4 needs an
# upstream Tauri/wry/tray-icon transition. proc-macro-error is pulled by the
# GTK3 macro stack. The unic-* crates are pulled by Tauri's urlpattern dependency.
# The current Tauri updater still requires zip 4, and zbus 5 still requires the
# standalone zbus_names and zvariant crates. No compatible upstream upgrade is
# available for these advisories yet.
ignore = [
    # GTK3 bindings (Tauri/wry/tray-icon/libappindicator transitive chain).
    "RUSTSEC-2024-0411", # gdkwayland-sys
    "RUSTSEC-2024-0412", # gdk
    "RUSTSEC-2024-0413", # atk
    "RUSTSEC-2024-0414", # gdkx11-sys
    "RUSTSEC-2024-0415", # gtk-sys
    "RUSTSEC-2024-0416", # atk-sys
    "RUSTSEC-2024-0417", # gdkx11
    "RUSTSEC-2024-0418", # gdk-sys
    "RUSTSEC-2024-0419", # gtk
    "RUSTSEC-2024-0420", # gtk3-macros

    # GTK3 macro dependency; no safe upgrade is available.
    "RUSTSEC-2024-0370", # proc-macro-error

    # Tauri's urlpattern dependency; no safe upgrade is available.
    "RUSTSEC-2025-0075", # unic-char-range
    "RUSTSEC-2025-0080", # unic-common
    "RUSTSEC-2025-0081", # unic-char-property
    "RUSTSEC-2025-0098", # unic-ucd-version
    "RUSTSEC-2025-0100", # unic-ucd-ident

    # tauri-plugin-updater 2.14.0 still requires zip ^4. The fix requires an
    # upstream updater release that accepts zip >=9.
    "RUSTSEC-2026-0367", # zip
    "RUSTSEC-2026-0368", # zip
    "RUSTSEC-2026-0369", # zip

    # Tauri plugins still depend on zbus 5, which requires these crates. The
    # upstream migration to zbus 6 is not yet compatible with this dependency tree.
    "RUSTSEC-2026-0370", # zvariant
    "RUSTSEC-2026-0371", # zbus_names
    "RUSTSEC-2026-0372", # zvariant_derive

    # serde_yaml_ng parses skill front matter. It uses unsafe-libyaml, which is
    # unmaintained. No vulnerability is known and no safe upgrade is available.
    # Remove this entry when the app moves to a safe Rust YAML parser (#735).
    "RUSTSEC-2024-0449", # unsafe-libyaml
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unlicense",
    "CC0-1.0",
    "MIT-0",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
    "BSL-1.0",
]

[bans]
deny = [
    { crate = "sentry" },
    { crate = "opentelemetry" },
    { crate = "posthog" },
    { crate = "segment" },
    { crate = "datadog" },
]
