# cargo-deny configuration for the antiburn desktop app crate.
#
# CI runs `cargo deny check licenses` against this crate's own lockfile; every
# dependency must carry one of the allowed permissive licenses. Unlike the
# engine's deny.toml, there is no network-stack ban here: the app shell
# legitimately links Tauri and its updater plugin — the engine remains the
# network-free boundary.

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unlicense",
    "CC0-1.0",
    "MIT-0",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
]
