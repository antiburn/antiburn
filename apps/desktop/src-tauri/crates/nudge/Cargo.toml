# Standalone package. The shell (`src-tauri`) is its own workspace root and does
# not list this crate as a member, so declaring an empty workspace table here
# keeps `cargo check` inside this directory from claiming to belong to a
# workspace that has never heard of it. The crate is a mechanism with no
# app-specific dependencies, so it resolves on its own.
[workspace]

[package]
name = "antiburn-nudge"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "Cross-platform floating notification nudges for the antiburn desktop app. Mechanism only — the app owns when/why a nudge fires."
license = "MPL-2.0"
repository = "https://github.com/antiburn/antiburn"
publish = false

[lib]
name = "antiburn_nudge"
path = "src/lib.rs"

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
# Facade only — the app installs the subscriber. Lets display resolution report
# which signal picked the screen, so a misplaced notification is diagnosable from
# a user's log rather than guessed at.
tracing = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
# Subclasses the notification window into a non-activating floating NSPanel so
# it never steals key focus from the user's frontmost app. Not published to
# crates.io; pinned to a v2.1 commit for reproducibility.
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", rev = "a3122e894383aa068ec5365a42994e3ac94ba1b6" }
# Finds the display showing the frontmost window (`CGWindowListCopyWindowInfo` +
# `CGDisplay`), so the notification appears where the user is actually looking
# rather than always on the primary display.
core-foundation = "0.10"
core-graphics = "0.25"

[target.'cfg(windows)'.dependencies]
# `ShowWindow(SW_SHOWNOACTIVATE)` on the notification's HWND, so revealing it
# never activates the window or pulls key focus from the user's frontmost app.
# Version matches what `tauri`'s own `hwnd()` returns (`windows::Win32::Foundation::HWND`),
# so this doesn't add a second incompatible copy of the `windows` crate.
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
# `gtk_window.set_focus_on_map(false)` before showing the notification, so it
# never takes input focus from the user's frontmost app. Version matches what
# `tauri` itself pulls in for `gtk_window()`, so this doesn't add a second copy.
gtk = { version = "0.18", features = ["v3_24"] }

[dev-dependencies]
serde_json = "1"
