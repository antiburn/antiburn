# Standalone package. The shell excludes this nested workspace and uses it as a
# path dependency. The crate owns only the floating HUD window mechanism.
[workspace]

[package]
name = "antiburn-hud"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "The floating usage HUD window mechanism for the antiburn desktop app."
license = "MPL-2.0"
repository = "https://github.com/antiburn/antiburn"
publish = false

[lib]
name = "antiburn_hud"
path = "src/lib.rs"

[dependencies]
serde_json = "1"
tauri = { version = "2", features = ["macos-private-api"] }

[target.'cfg(target_os = "macos")'.dependencies]
tokio = { version = "1", features = ["time"] }
