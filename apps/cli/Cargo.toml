[workspace]
resolver = "3"

[package]
name = "antiburn-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "Agent-oriented Antiburn CLI"
license = "MIT"
publish = false

[[bin]]
name = "antiburn"
path = "src/main.rs"

[dependencies]
antiburn-checks-store = { path = "../../crates/antiburn-checks-store" }
antiburn-local = { path = "../../crates/antiburn-local" }
clap = { version = "4.5", features = ["derive"] }
dirs = "7"
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "rt"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["ansi", "fmt", "json"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"
