[workspace]
resolver = "3"

[package]
name = "antiburn-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "Agent-oriented Antiburn CLI"
license = "MIT"
publish = false

[[bin]]
name = "antiburn"
path = "src/main.rs"

[dependencies]
antiburn-checks-store = { path = "../../crates/antiburn-checks-store" }
antiburn-local = { path = "../../crates/antiburn-local" }
base64 = { version = "0.22", optional = true }
clap = { version = "4.5", features = ["derive"] }
dirs = "7"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"], optional = true }
rusqlite = { version = "0.32.1", features = ["bundled", "hooks", "limits"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
sha2 = "0.11"
time = { version = "0.3", features = ["parsing"], optional = true }
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "rt"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["ansi", "fmt", "json"] }
uuid = { version = "1", features = ["serde"], optional = true }

[features]
cloud = ["dep:base64", "dep:reqwest", "dep:time", "dep:uuid", "tokio/net", "tokio/time"]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"

[patch.crates-io]
libsqlite3-sys = { path = "../../crates/antiburn-local/vendor/libsqlite3-sys" }
