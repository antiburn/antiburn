# Approved source inventory for the first antiburn public repository commit.
#
# Rules authorize private-repository inputs, not permission to copy an entire
# directory unchanged. `adapt` requires extracting only the behavior described
# here and satisfying every matching deny rule. Independently authored public
# files use Git/DCO provenance instead of synthetic private-source rules; the
# denylist and publication checks still apply to the complete public tree.

schema_version = 1
status = "approved"
# Active canonical private repository and provenance source for the initial OSS extraction. This
# repository and exact reviewed commit identify the source tree whose rights and boundary were
# reviewed.
source_repository = "TeamCadenceAI/cadence"
current_canonical_private_repository = "TeamCadenceAI/cadence"
# The D-020 and D-021 frontend slices were reviewed at later commits on this same docs-only
# branch; the desktop/ source tree is unchanged from this commit. Refresh source_commit whenever
# a manifest amendment reviews a changed source tree.
source_commit = "54c4a3bceda80558760a9ff6fc8bf7d04873b43f"
# The intended future private target is not an OSS prerequisite and has no source SHA yet. If a
# later authorized platform migration makes it canonical, version this manifest at the next source
# review to record its exact reviewed commit while retaining Cadence provenance.
intended_future_private_repository = "antiburn/antiburn-cloud"
governance_decisions = ["D-001", "D-002", "D-003", "D-005", "D-007", "D-008", "D-009", "D-010", "D-011", "D-012", "D-014", "D-020", "D-021", "D-022", "D-023", "D-024", "D-026", "D-028", "D-029"]
default_action = "deny"
publication_authorization = "authorized MPL-2.0 repository commit or merge; unresolved rights remain denied"
third_party_resolution = "deferred until the public local-crate manifest and lockfile exist"
glob_semantics = "* matches one path segment; ** matches recursively"
approval_note = "Phase 0 complete; implementation checks run when their artifacts exist"
fixture_resolution = "replace current initial-context fixtures during engine extraction"

