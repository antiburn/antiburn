      <div class="sl-window-bar"><span class="sl-window-dot"></span><span class="sl-window-dot"></span><span class="sl-window-dot"></span><span class="sl-window-title">Sessions</span><span class="sl-theme-label">Dark</span></div>

  <script>
    (() => {
      const root = document.getElementById("session-list-check-line");
      if (!root) return;
      const state = { palette: "blue-orange", blueStyle: "cyan" };
      const namespace = "http://www.w3.org/2000/svg";
      const tones = { pass: "var(--sl-pass)", fail: "var(--sl-fail)", neutral: "var(--sl-neutral)" };
      const gap = 30;

      function polar(angle) {
        const radians = ((angle - 90) * Math.PI) / 180;
        return { x: 32 + 28 * Math.cos(radians), y: 32 + 28 * Math.sin(radians) };
      }

      function arcPath(startAngle, endAngle) {
        const start = polar(endAngle);
        const end = polar(startAngle);
        const largeArc = endAngle - startAngle <= 180 ? 0 : 1;
        return `M ${start.x.toFixed(3)} ${start.y.toFixed(3)} A 28 28 0 ${largeArc} 0 ${end.x.toFixed(3)} ${end.y.toFixed(3)}`;
      }

      function shape(name) {
        const element = document.createElementNS(namespace, name);
        element.setAttribute("fill", "none");
        element.setAttribute("stroke-width", "8");
        element.setAttribute("stroke-linecap", "round");
        return element;
      }

      function drawRing(svg) {
        svg.replaceChildren();
        svg.setAttribute("viewBox", "0 0 64 64");
        svg.setAttribute("focusable", "false");
        if (svg.dataset.ring === "indeterminate") {
          const path = shape("path");
          path.setAttribute("d", arcPath(0, 260));
          path.setAttribute("stroke", tones.neutral);
          svg.append(path);
          return;
        }
        const segments = (svg.dataset.ring || "").split(",").map((item) => {
          const [rawValue, tone] = item.split(":");
          return { value: Number(rawValue), tone };
        }).filter((item) => Number.isFinite(item.value) && item.value > 0 && tones[item.tone]);
        const total = segments.reduce((sum, segment) => sum + segment.value, 0);
        if (!total) return;
        if (segments.length === 1) {
          const circle = shape("circle");
          circle.setAttribute("cx", "32");
          circle.setAttribute("cy", "32");
          circle.setAttribute("r", "28");
          circle.setAttribute("stroke", tones[segments[0].tone]);
          svg.append(circle);
          return;
        }
        const usableAngle = 360 - gap * segments.length;
        let cursor = 0;
        for (const segment of segments) {
          const span = usableAngle * segment.value / total;
          const path = shape("path");
          path.setAttribute("d", arcPath(cursor, cursor + span));
          path.setAttribute("stroke", tones[segment.tone]);
          svg.append(path);
          cursor += span + gap;
        }
      }

      function render() {
        root.dataset.palette = state.palette;
        root.dataset.blueStyle = state.blueStyle;
        root.querySelector(".sl-heading-note").textContent = state.palette === "blue-orange" ? "Blue + Antiburn orange" : "Green + red";
        root.querySelectorAll("[data-blue-choice]").forEach((button) => {
          button.setAttribute("aria-pressed", String(button.dataset.blueChoice === state.blueStyle));
        });
        root.querySelectorAll("svg[data-ring]").forEach(drawRing);
      }

      function markOutcomeCopy(container) {
        container.querySelectorAll(".sl-check-copy").forEach((element) => {
          const sourceText = element.textContent;
          const parts = sourceText.split(/(\d+ Burn Checks? failed|All \d+ Burn Checks passed|\d+ Burn Checks passed|\d+ passed)/g);
          if (parts.length === 1) return;
          element.replaceChildren(...parts.filter(Boolean).map((part) => {
            if (!part.endsWith("failed") && !part.endsWith("passed")) return document.createTextNode(part);
            const outcome = document.createElement("span");
            outcome.className = part.endsWith("failed") ? "sl-failure-copy" : "sl-pass-copy";
            outcome.textContent = part;
            return outcome;
          }));
        });
      }

      const template = root.querySelector("#sl-all-states-template");
      if (template) {
        markOutcomeCopy(template.content);
        template.content.querySelectorAll(".sl-session-meta").forEach((meta) => {
          const [repository, timestamp] = meta.textContent.split(" · ");
          const model = document.createElement("div");
          const modelName = document.createElement("span");
          model.className = "sl-session-model";
          modelName.className = "sl-session-model-name";
          modelName.textContent = "5.6-sol";
          model.append(modelName, document.createTextNode(" high"));
          meta.before(model);
          meta.replaceChildren(Object.assign(document.createElement("span"), { textContent: repository }), Object.assign(document.createElement("span"), { textContent: timestamp }));
        });
        root.querySelectorAll("[data-session-list]").forEach((list) => {
          list.replaceChildren(template.content.cloneNode(true));
        });
      }
      root.querySelectorAll("[data-blue-choice]").forEach((button) => {
        button.addEventListener("click", () => {
          state.blueStyle = button.dataset.blueChoice;
          render();
        });
      });
      render();
      if (globalThis.lucide) globalThis.lucide.createIcons();
      if (globalThis.Tweak) {
        const tweak = new globalThis.Tweak({ container: root, onChange: render });
        tweak.addSelect(state, "palette", { label: "Status palette", options: [{ label: "Blue + Antiburn orange", value: "blue-orange" }, { label: "Green + red", value: "green-red" }], reference: "BurnCheckStatus.palette" });
        tweak.addSelect(state, "blueStyle", { label: "Blue", options: [{ label: "Sky", value: "sky" }, { label: "Reference cyan", value: "cyan" }], reference: "BurnCheckStatus.blue" });
      }
    })();
  </script>
