  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)

  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:

    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {

  height: 20px;

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;

  height: 16px;

  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;

  height: 28px;
  flex: 1;

  padding: 0;

.form-range::-webkit-slider-runnable-track {
  height: 28px;

}

.form-range::-webkit-slider-thumb {

  width: 20px;
  height: 20px;
  margin-top: 4px;

}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);

}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;

  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(

.btn:focus-visible,
.nav-link:focus-visible {

@media (pointer: coarse) {

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&quot;session-card-ia-variants&quot;);
      if (!root) return;
      const state = { blueStyle: &quot;cyan&quot; };
      const namespace = &quot;http://www.w3.org/2000/svg&quot;;
      const tones = { pass: &quot;var(--sc-pass)&quot;, fail: &quot;var(--sc-orange)&quot; };
      const gap = 30;

      function polar(angle) {
        const radians = ((angle - 90) * Math.PI) / 180;
        return { x: 32 + 28 * Math.cos(radians), y: 32 + 28 * Math.sin(radians) };
      }

      function arcPath(startAngle, endAngle) {
        const start = polar(endAngle);
        const end = polar(startAngle);
        const largeArc = endAngle - startAngle &lt;= 180 ? 0 : 1;
        return `M ${start.x.toFixed(3)} ${start.y.toFixed(3)} A 28 28 0 ${largeArc} 0 ${end.x.toFixed(3)} ${end.y.toFixed(3)}`;
      }

      function drawRing(svg) {
        svg.replaceChildren();
        svg.setAttribute(&quot;viewBox&quot;, &quot;0 0 64 64&quot;);
        svg.setAttribute(&quot;focusable&quot;, &quot;false&quot;);
        const segments = (svg.dataset.ring || &quot;&quot;).split(&quot;,&quot;).map((item) =&gt; {
          const [rawValue, tone] = item.split(&quot;:&quot;);
          return { value: Number(rawValue), tone };
        }).filter((item) =&gt; Number.isFinite(item.value) &amp;&amp; item.value &gt; 0 &amp;&amp; tones[item.tone]);
        const total = segments.reduce((sum, segment) =&gt; sum + segment.value, 0);
        if (!total) return;
        const usableAngle = 360 - gap * segments.length;
        let cursor = 0;
        for (const segment of segments) {
          const span = usableAngle * segment.value / total;
          const path = document.createElementNS(namespace, &quot;path&quot;);
          path.setAttribute(&quot;d&quot;, arcPath(cursor, cursor + span));
          path.setAttribute(&quot;fill&quot;, &quot;none&quot;);
          path.setAttribute(&quot;stroke&quot;, tones[segment.tone]);
          path.setAttribute(&quot;stroke-width&quot;, &quot;8&quot;);
          path.setAttribute(&quot;stroke-linecap&quot;, &quot;round&quot;);
          svg.append(path);
          cursor += span + gap;
        }
      }

      function render() {
        root.dataset.blueStyle = state.blueStyle;
        root.querySelectorAll(&quot;[data-blue-choice]&quot;).forEach((button) =&gt; {
          button.setAttribute(&quot;aria-pressed&quot;, String(button.dataset.blueChoice === state.blueStyle));
        });
        root.querySelectorAll(&quot;svg[data-ring]&quot;).forEach(drawRing);
      }

      function markOutcomeCopy(container) {
        container.querySelectorAll(&quot;.sc-check-copy&quot;).forEach((element) =&gt; {
          const sourceText = element.textContent;
          const parts = sourceText.split(/(\d+ Burn Checks? failed|All \d+ Burn Checks passed|\d+ Burn Checks passed|\d+ passed)/g);
          if (parts.length === 1) return;
          element.replaceChildren(...parts.filter(Boolean).map((part) =&gt; {
            if (!part.endsWith(&quot;failed&quot;) &amp;&amp; !part.endsWith(&quot;passed&quot;)) return document.createTextNode(part);
            const outcome = document.createElement(&quot;span&quot;);
            outcome.className = part.endsWith(&quot;failed&quot;) ? &quot;sc-failure-copy&quot; : &quot;sc-pass-copy&quot;;
            outcome.textContent = part;
            return outcome;
          }));
        });
      }

      root.querySelectorAll(&quot;.sc-grid &gt; section&quot;).forEach((section) =&gt; {
        const light = section.querySelector(&quot;.sc-window&quot;);
        if (!light) return;
        const pair = document.createElement(&quot;div&quot;);
        const dark = light.cloneNode(true);
        light.classList.add(&quot;sc-window-light&quot;);
        dark.classList.add(&quot;sc-window-dark&quot;);
        light.querySelector(&quot;.sc-theme-label&quot;).textContent = &quot;Light&quot;;
        dark.querySelector(&quot;.sc-theme-label&quot;).textContent = &quot;Dark&quot;;
        pair.className = &quot;sc-mode-pair&quot;;
        light.before(pair);
        pair.append(light, dark);
      });
      root.querySelectorAll(&quot;[data-blue-choice]&quot;).forEach((button) =&gt; {
        button.addEventListener(&quot;click&quot;, () =&gt; {
          state.blueStyle = button.dataset.blueChoice;
          render();
        });
      });
      markOutcomeCopy(root);
      render();
      if (globalThis.lucide) globalThis.lucide.createIcons();
      if (globalThis.Tweak) {
        const tweak = new globalThis.Tweak({ container: root, onChange: render });
        tweak.addSelect(state, &quot;blueStyle&quot;, { label: &quot;Blue&quot;, options: [{ label: &quot;Sky&quot;, value: &quot;sky&quot; }, { label: &quot;Reference cyan&quot;, value: &quot;cyan&quot; }], reference: &quot;SessionCard.blue&quot; });
      }
    })();
